# improve colors
set -g default-terminal 'screen-256color'

# how long to show pane numbers (C-a q).
# Default is too fast to scan the screen.
set display-panes-time 10000  # (which is 10 sec)

# Change ctrl+b to ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Pane navigation (vim-style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes (vim-style with capital letters or Alt+arrows)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alternative: resize with Ctrl+arrow keys
bind -r C-Left resize-pane -L 5
bind -r C-Down resize-pane -D 5
bind -r C-Up resize-pane -U 5
bind -r C-Right resize-pane -R 5

# Equalize panes
bind = select-layout even-horizontal
bind | select-layout even-vertical
bind + select-layout tiled

# split in current directory
bind-key v split-window -h -c "#{pane_current_path}"
bind-key b split-window -c "#{pane_current_path}"

# Override default bindings to use current directory
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# soften status bar color from harsh green to light gray
set -g status-bg '#666666'
set -g status-fg '#aaaaaa'

# Status bar update interval (1 second for smooth animation)
set -g status-interval 1

# Status bar format with animated neko
set -g status-left-length 50
set -g status-right-length 100
set -g status-left "#[fg=green,bold]#S #[fg=yellow]#(~/.config/tmux_neko.sh) "
set -g status-right "#[fg=cyan]%H:%M:%S #[fg=yellow]%Y-%m-%d #[fg=magenta]#H"

# increase scrollback lines
set -g history-limit 10000

# Enable mouse mode (tmux 2.1+)
set -g mouse on

# Use vi keys in copy mode
setw -g mode-keys vi

# vi-style copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Easy copy mode entry
bind-key -n C-Space copy-mode

# Copy entire scrollback to clipboard (Ctrl+a then y)
bind-key y run-shell "tmux capture-pane -pS - | pbcopy"

# Visual feedback for active pane
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour33

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'
# save session
set -g @plugin 'tmux-plugins/tmux-resurrect'

# set tmux use default zsh
set-option -g default-shell /bin/zsh


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# if tpm is missing git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# check using tmux source-file ~/.tmux.conf
run '~/.tmux/plugins/tpm/tpm'
